name: Rafraîchir le cache du calendrier économique

# Contourne le blocage de l'IP partagée de Render sur nfs.faireconomy.media :
# GitHub Actions récupère le JSON depuis son infrastructure (IP différente) et
# le commit dans le repo. Render lit ensuite ce fichier en HTTP simple (jamais
# bloqué) au lieu d'appeler ForexFactory directement. Voir calendar_fetcher.py.
#
# Commit sur la branche "cache-data", PAS sur "main" : Render redéploie sur
# chaque push vers main (pas de filtre par chemin dispo sur le plan gratuit),
# ce qui effacerait la base SQLite (disque éphémère) à chaque rafraîchissement
# du cache, même sans changement de code réel — constaté en conditions réelles.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Si des runs s'empilent en file d'attente (ex: panne GitHub Actions, voir
# refresh-fxstreet.yml) plutôt que d'attendre des heures puis d'être annulé en
# masse, un nouveau déclenchement annule directement le run encore en attente
# — un seul run utile à la fois suffit de toute façon (le calendrier de la
# semaine change rarement d'une exécution à l'autre).
concurrency:
  group: refresh-calendar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cache-data

      - name: Récupérer le calendrier ForexFactory
        run: |
          set -e
          curl -sf --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (trading-news-agent-cache-refresher)" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o ff_raw.json
          python3 -c "import json; data=json.load(open('ff_raw.json')); assert isinstance(data, list) and len(data) > 0, 'JSON vide ou invalide'"

      - name: Construire calendar_cache.json (avec horodatage)
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          events = json.load(open('ff_raw.json'))
          cache = {'fetched_at': datetime.now(timezone.utc).isoformat(), 'events': events}
          json.dump(cache, open('calendar_cache.json', 'w'), ensure_ascii=False, indent=2)
          "
          rm ff_raw.json

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar_cache.json
          git diff --staged --quiet && echo "Rien de nouveau à commiter." || git commit -m "Rafraîchissement automatique du cache calendrier"
          git push origin HEAD:cache-data
